name: loocle
description: A Flutter app for displaying local images like Google Photos
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # File system access
  file_picker: ^8.0.0+1
  path_provider: ^2.1.1

  # Image handling
  photo_view: ^0.14.0
  cached_network_image: ^3.3.0
  image: ^4.1.3

  # UI components
  flutter_staggered_grid_view: ^0.7.0

  # Permissions
  permission_handler: ^11.0.1

  # State management
  provider: ^6.1.1

  # Icons
  cupertino_icons: ^1.0.2

  # Directory access for desktop
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true